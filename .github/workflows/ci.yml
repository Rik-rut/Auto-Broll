name: CI

on:
  push:
    branches: [main, audit]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type-check annotations
        run: uv run ruff check --select ANN src/broll_agent/cli.py src/broll_agent/config.py src/broll_agent/models.py src/broll_agent/analyze.py src/broll_agent/planner.py src/broll_agent/transcribe.py src/broll_agent/llm_client.py src/broll_agent/generate_lightning.py src/broll_agent/download_searxng.py src/broll_agent/video_utils.py

      - name: Run tests
        run: uv run pytest

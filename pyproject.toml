[project]
name = "auto-broll"
version = "0.1.0"
description = "CLI pipeline that watches narration videos and produces broll image suggestions via SDXL Lightning generation and SearXNG downloads."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "litellm>=1.40",
    "faster-whisper>=1.0.3",
    "diffusers>=0.36.0",
    "accelerate>=1.0",
    "transformers>=4.44",
    "torch>=2.4",
    # cuBLAS/cuDNN for ctranslate2 (faster-whisper) GPU inference on Windows
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12; sys_platform == 'win32'",
    "httpx>=0.27",
    "typer>=0.12",
    "pillow>=10.3",
    "mmgp==3.7.10",
    "optimum-quanto>=0.2.4",
]

[project.scripts]
broll-agent = "broll_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyPI ships CPU-only torch wheels; the CUDA build comes from PyTorch's own index.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.hatch.build.targets.wheel]
packages = ["src/broll_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
